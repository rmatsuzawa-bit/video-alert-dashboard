<!DOCTYPE html>
<html lang="ja" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未作成タスクモニター - 管理設定</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script>
if (window.tailwind) tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: { sans: ['"Noto Sans JP"', 'system-ui', '-apple-system', 'sans-serif'] } } }
};
</script>

<style>
  :root{
    --surface-1:#ffffff; --plane:#f6f7f9;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --hairline:#e3e5ea; --bar:#2a78d6;
  }
  .dark{
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --hairline:#2c2c2a; --bar:#3987e5;
  }
  body{ background:var(--plane); color:var(--ink-1); }
  .card-surface{ background:var(--surface-1); border-color:var(--hairline); }
  .ink-2{ color:var(--ink-2); } .ink-3{ color:var(--ink-3); }
  .hair{ border-color:var(--hairline); }
</style>
</head>

<body class="font-sans antialiased">
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-8">

  <header class="pb-5 border-b hair">
    <a href="/" class="text-xs ink-3 hover:opacity-70">← ダッシュボードに戻る</a>
    <h1 class="text-2xl font-bold mt-2">管理設定</h1>
    <p class="text-sm ink-2 mt-1">ここで登録した内容は、ダッシュボードの同期時に自動で反映されます。</p>
  </header>

  <section class="mt-6 card-surface border rounded-xl p-4 sm:p-5">
    <h2 class="font-bold">一時停止中の企業</h2>
    <p class="text-xs ink-3 mt-1">登録した企業名（完全一致）はダッシュボードに一切表示されなくなります。</p>
    <div id="pausedList" class="mt-3 space-y-2"></div>
    <div class="mt-3 flex gap-2">
      <input id="pausedInput" type="text" placeholder="企業名を入力"
        class="flex-1 card-surface border rounded-lg px-3 py-2 text-sm">
      <button id="pausedAdd" type="button" class="px-4 py-2 rounded-lg text-sm font-bold text-white" style="background:var(--bar)">追加</button>
    </div>
  </section>

  <section class="mt-4 card-surface border rounded-xl p-4 sm:p-5">
    <h2 class="font-bold">除外キーワード</h2>
    <p class="text-xs ink-3 mt-1">企業名にこの文字列が含まれていたら、ダッシュボードに表示されなくなります。</p>
    <div id="keywordList" class="mt-3 space-y-2"></div>
    <div class="mt-3 flex gap-2">
      <input id="keywordInput" type="text" placeholder="キーワードを入力"
        class="flex-1 card-surface border rounded-lg px-3 py-2 text-sm">
      <button id="keywordAdd" type="button" class="px-4 py-2 rounded-lg text-sm font-bold text-white" style="background:var(--bar)">追加</button>
    </div>
  </section>

  <div class="mt-5 flex items-center gap-3">
    <button id="saveBtn" type="button" class="px-6 py-2.5 rounded-lg font-bold text-white text-sm" style="background:var(--bar)">保存する</button>
    <span id="saveMsg" class="text-sm"></span>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
(function initTheme(){
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
})();

let config = { pausedCompanies: [], excludeKeywords: [] };

function row(value, onRemove){
  const div = document.createElement('div');
  div.className = 'flex items-center gap-2 card-surface border rounded-lg px-3 py-2 text-sm';
  const span = document.createElement('span');
  span.className = 'flex-1 break-all';
  span.textContent = value;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'text-xs ink-3 hover:opacity-70 shrink-0';
  btn.textContent = '削除';
  btn.onclick = onRemove;
  div.append(span, btn);
  return div;
}

function render(){
  const pausedList = $('#pausedList');
  pausedList.innerHTML = '';
  if (!config.pausedCompanies.length) pausedList.innerHTML = '<p class="text-xs ink-3">登録なし</p>';
  config.pausedCompanies.forEach((v, i) => pausedList.appendChild(row(v, () => {
    config.pausedCompanies.splice(i, 1); render();
  })));

  const keywordList = $('#keywordList');
  keywordList.innerHTML = '';
  if (!config.excludeKeywords.length) keywordList.innerHTML = '<p class="text-xs ink-3">登録なし</p>';
  config.excludeKeywords.forEach((v, i) => keywordList.appendChild(row(v, () => {
    config.excludeKeywords.splice(i, 1); render();
  })));
}

async function load(){
  const res = await fetch('/api/config', { cache: 'no-store' });
  config = await res.json();
  render();
}

$('#pausedAdd').onclick = () => {
  const v = $('#pausedInput').value.trim();
  if (!v) return;
  config.pausedCompanies.push(v);
  $('#pausedInput').value = '';
  render();
};
$('#keywordAdd').onclick = () => {
  const v = $('#keywordInput').value.trim();
  if (!v) return;
  config.excludeKeywords.push(v);
  $('#keywordInput').value = '';
  render();
};
$('#pausedInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pausedAdd').click(); });
$('#keywordInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#keywordAdd').click(); });

$('#saveBtn').onclick = async () => {
  $('#saveMsg').textContent = '保存中…';
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    });
    if (!res.ok) throw new Error('保存に失敗しました');
    $('#saveMsg').textContent = '✓ 保存しました';
    $('#saveMsg').style.color = '#0ca30c';
  } catch (e) {
    $('#saveMsg').textContent = e.message;
    $('#saveMsg').style.color = '#d03b3b';
  }
  setTimeout(() => $('#saveMsg').textContent = '', 3000);
};

load();
</script>
</body>
</html>
