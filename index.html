<script>
/* =========================================================
   0. ユーティリティ
   ========================================================= */
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
const DOW = '日月火水木金土';

/* テーマ */
(function initTheme(){
  const saved = localStorage.getItem('vad-theme');
  const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
})();
$('#themeBtn').onclick = () => {
  const dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem('vad-theme', dark ? 'dark' : 'light');
};

/* 基準日 */
function todayMidnight(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function toInput(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
$('#baseDate').value = toInput(todayMidnight());
function baseDate(){
  const v = $('#baseDate').value;
  if (!v) return todayMidnight();
  const [y,m,d] = v.split('-').map(Number);
  return new Date(y, m-1, d);
}

/* =========================================================
   1. TSV / CSV パーサ（引用符・セル内改行に対応）
   ========================================================= */
function parseDelimited(text){
  const head = text.slice(0, 5000);
  const delim = head.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === delim){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  row.push(field); rows.push(row);
  return rows;
}

/* =========================================================
   2. 日付の解釈（「7月16日(木)」「2026/7/16」「7/16」）
      曜日が一致する年を優先して年をまたぐ表を正しく読む
   ========================================================= */
function parseJPDate(s, base){
  const t = String(s || '').trim();
  if (!t) return null;
  let mo, da;
  const full = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (full) return new Date(+full[1], +full[2]-1, +full[3]);
  const jp = t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if (jp){ mo = +jp[1]; da = +jp[2]; }
  else {
    const sl = t.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
    if (!sl) return null;
    mo = +sl[1]; da = +sl[2];
  }
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  const dowM = t.match(/[(（]\s*([日月火水木金土])\s*[)）]/);
  const by = base.getFullYear();
  const pick = requireDow => {
    let best = null;
    for (const y of [by-1, by, by+1]){
      const d = new Date(y, mo-1, da);
      if (d.getMonth() !== mo-1) continue;
      if (requireDow && dowM && DOW[d.getDay()] !== dowM[1]) continue;
      const diff = Math.abs((d - base) / 86400000);
      if (!best || diff < best.diff) best = { d, diff };
    }
    return best;
  };
  const best = pick(true) || pick(false);
  return best ? best.d : null;
}

/* =========================================================
   3. ステータス判定
   ========================================================= */
const STATUS_GROUPS = [
  { key:'未作成',       match:['未作成','未記入'] },
  { key:'作成中',       match:['作成中'] },
  { key:'素材待ち',     match:['素材作成中','素材待ち','素材なし','未撮影','素材について'] },
  { key:'QA確認依頼中', match:['QA確認'] },
  { key:'確認待ち',     match:['P確認待ち','優君確認待ち','動画班確認待ち','確認待ち'] },
  { key:'送信前',       match:['ディレクター送信済み','未送信','貼り付け'] }
];
function groupOf(status){
  const s = String(status || '').trim();
  if (!s) return '未作成';
  for (const g of STATUS_GROUPS) if (g.match.some(m => s.includes(m))) return g.key;
  return 'その他';
}
function isDone(status){
  const s = String(status || '').trim();
  if (!s) return false;
  if (!$('#dirDone').checked && s.includes('ディレクター送信済み')) return false;
  return doneTerms().some(t => t && s.includes(t));
}
function doneTerms(){
  const base = $('#doneList').value.split(',').map(x => x.trim()).filter(Boolean);
  if ($('#dirDone').checked) base.push('ディレクター送信済み');
  return base;
}

/* リマインド文からは確認待ち系（P/D/QA確認待ち）と確認済みの案件は除く */
function isReminderTarget(i){
  return i.group !== '確認待ち' && i.group !== 'QA確認依頼中' && !i.statusRaw.includes('確認済み');
}

/* =========================================================
   4. 表の解析：ヘッダー行（「投稿日」を含む行）ごとにブロック化
   ========================================================= */
const HEADER_WORDS = ['端末','投稿日','作成者','CT','テキストサイズ','備考','インスタ','TikTok','YouTube','RED','TOPに戻る','色・フォント','TRUE','FALSE','状態'];
const META_LABELS  = ['基本編集','撮影','運用','P','D'];

/* ヘッダー行のセル結合だと不自然な名前になる行の個別補正（「／」でつないだ名前 → 差し替え後の名前） */
const COMPANY_OVERRIDES = {
  '冴えたいこやくん／リアルクエスト～本日の依頼～': 'リアルクエスト～本日の依頼～',
  '変身ベルト／予約時FBオフかチェック': '変身ベルト',
  'ベルク／(確認あり)※作成早めに！': 'ベルク',
  '一般社団法人徳洲会／注意すること多いので枠外までチェック': '一般社団法人徳洲会',
  '株式会社都築ネクスト／動画班確認待ち': '株式会社都築ネクスト',
  'ライフケアデザイン株式会社／※確認遅いので作成早めに！！！': 'ライフケアデザイン株式会社',
  'mederi株式会社（メデリ）／開示チェック必ずつける': 'mederi株式会社（メデリ）',
  '株式会社平四郎／予約時Facebookオフ': '株式会社平四郎',
  '株式会社ルーデン・ライフサービス／Facebookオフ': '株式会社ルーデン・ライフサービス',
  '学校法人正和学園／おうじにもタスクだよ': '学校法人正和学園',
  'MXモバイリング株式会社／4/20～画像先にやってるよ(終了4/19)': 'MXモバイリング株式会社',
  '株式会社ASCare（アスケア）集客用／7/24～画像先に(終了7/23)': '株式会社ASCare（アスケア）集客用'
};

/* 自社アカウント（クライアント企業ではない）。抽出期間の設定に関わらず最低16日先まで表示する */
const IN_HOUSE_COMPANIES = new Set([
  '～突撃してみた～／けいたろう社長',
  '変身ベルト',
  'RCの部屋：short',
  'あなたの推しは？',
  '朝礼昼礼終礼',
  'それってどんな仕事？',
  'ふところヒロシ',
  '本音上司',
  'うちの友だち見てくれへん？',
  '昭和上司と令和部下',
  'けいたろう君新コンテンツ（ゆう）',
  '40代メンズファッションをお前が語るな',
  '冴えたいこやくん',
  'リアルクエスト～本日の依頼～'
]);
const IN_HOUSE_MIN_RANGE = 16;

/* 「撮影＊さとあや　運用＊みえ　P＊れん」のような担当メモ行を分解する。
   ラベルだけで値が空の場合（例：運用＊　D＊れん）は空として扱う。 */
function parseMeta(str){
  const out = { editor:'', ope:'', dir:'', shoot:'' };
  const key = { '基本編集':'editor', '運用':'ope', '撮影':'shoot', 'P':'dir', 'D':'dir' };
  const seg = String(str).split(/[＊*※]/);          // 「撮影＊◯◯　運用＊△△」を区切る
  const tail = /(基本編集|撮影|運用|[PD])[\s　]*$/;   // 直前セグメントの末尾がラベル
  for (let i = 0; i < seg.length - 1; i++){
    const lm = seg[i].match(tail);
    if (!lm) continue;
    let v = seg[i+1].replace(tail, '')              // 次のラベルを取り除く
      .replace(/^[\s　]+/, '')
      .split(/[\s　\t]/)[0]
      .replace(/[（(].*$/, '')
      .trim();
    if (META_LABELS.includes(v)) v = '';
    const k = key[lm[1]];
    if (v && !out[k]) out[k] = v;
  }
  return out;
}

function extractItems(rows, base){
  const items = [];
  let block = null, skipped = 0;

  const isHeader = r => r.some(c => String(c).trim() === '投稿日');

  for (const r of rows){
    if (isHeader(r)){
      const iDate   = r.findIndex(c => String(c).trim() === '投稿日');
      const iDevice = r.findIndex(c => String(c).trim() === '端末');
      const iAuthor = r.findIndex(c => String(c).trim() === '作成者');
      const iStatus = iDevice > 0 ? iDevice - 1 : Math.max(0, iDate - 2);
      const name = r.slice(0, iDate)
        .map(c => String(c).trim())
        .filter(c => c && !HEADER_WORDS.includes(c) && c.length < 80)
        .join('／');
      block = { name: COMPANY_OVERRIDES[name] || name || '（名称不明）', iDate, iStatus, iAuthor, editor:'', ope:'', dir:'', shoot:'' };
      continue;
    }
    if (!block) continue;

    const joined = r.join(' ');

    /* 担当メタ行（基本編集＊/撮影＊/運用＊/P＊/D＊） */
    if (/(基本編集|撮影|運用|[PD])[\s　]*[＊*※]/.test(joined)){
      const meta = parseMeta(joined);
      block.editor = block.editor || meta.editor;
      block.ope    = block.ope    || meta.ope;
      block.dir    = block.dir    || meta.dir;
      block.shoot  = block.shoot  || meta.shoot;
      if (!/\d+\s*月\s*\d+\s*日/.test(joined)) continue;
    }

    /* データ行 */
    const dateRaw = (r[block.iDate] || '').trim();
    if (!dateRaw) continue;
    const date = parseJPDate(dateRaw, base);
    if (!date){ skipped++; continue; }

    const status = (r[block.iStatus] || '').trim();
    let author = (block.iAuthor >= 0 ? (r[block.iAuthor] || '') : '').trim();
    if (!author || author === 'TRUE' || author === 'FALSE'){
      for (const k of [block.iDate + 1, block.iDate + 2]){
        const v = (r[k] || '').trim();
        if (v && v !== 'TRUE' && v !== 'FALSE' && !/^\d/.test(v)){ author = v; break; }
      }
    }
    /* 行ごとのコンテンツ名・メモ（ステータス列より左のセル） */
    let sub = r.slice(0, block.iStatus)
      .map(c => String(c).replace(/\s+/g, ' ').trim())
      .filter(c => c && c !== block.name)
      .join(' ／ ');
    if (sub.length > 70) sub = sub.slice(0, 70) + '…';

    items.push({
      company: block.name,
      sub,
      status, statusRaw: status || '未記入（未作成）',
      group: groupOf(status),
      date, dateRaw,
      author, editor: block.editor, ope: block.ope, dir: block.dir,
      owner: block.editor || '担当未設定'
    });
  }
  return { items, skipped };
}

/* =========================================================
   5. 同期 ＋ 抽出（期間 × 未完了）
   ========================================================= */
let ALL = [];
let RAW_TEXT = '';

async function syncData(){
  $('#syncStatus').textContent = '同期中…';
  $('#syncBtn').disabled = true;
  try {
    const res = await fetch('/api/sheet', { cache:'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    RAW_TEXT = await res.text();
    const now = new Date();
    $('#syncStatus').textContent =
      `最終同期：${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    runExtract();
  } catch (e) {
    $('#syncStatus').textContent = `同期に失敗しました（${e.message}）`;
  } finally {
    $('#syncBtn').disabled = false;
  }
}

function runExtract(){
  if (!RAW_TEXT) return;
  const base = baseDate();

  const { items, skipped } = extractItems(parseDelimited(RAW_TEXT), base);
  const range = +$('#rangeDays').value;
  const past  = $('#incOverdue').checked ? 30 : 0;

  ALL = items.filter(it => {
    const diff = Math.round((it.date - base) / 86400000);
    const effectiveRange = IN_HOUSE_COMPANIES.has(it.company) ? Math.max(range, IN_HOUSE_MIN_RANGE) : range;
    if (diff > effectiveRange || diff < -past) return false;
    if (isDone(it.status)) return false;
    if (!it.status && !$('#incBlank').checked) return false;
    return true;
  }).map(it => {
    const diff = Math.round((it.date - base) / 86400000);
    return { ...it, diff, urg: diff < 0 ? 'over' : diff <= 3 ? 'u3' : diff <= 7 ? 'u7' : diff <= 14 ? 'u14' : 'u30' };
  });

  $('#parseNote').classList.remove('hidden');
  $('#parseNote').textContent =
    `解析完了：${items.length} 行を読み取り、${ALL.length} 件を抽出しました。`
    + (skipped ? `（投稿日が日付として読めない ${skipped} 行はスキップ）` : '');

  if (!ALL.length){
    $('#result').classList.add('hidden');
    return;
  }

  $('#result').classList.remove('hidden');
  buildFilters();
  render();
}

/* =========================================================
   6. 描画
   ========================================================= */
const URG = {
  over:{ label:'期限超過',   icon:'⚑', cls:'u-over',  stripe:'stripe-over' },
  u3  :{ label:'至急',       icon:'●', cls:'u-3',     stripe:'stripe-3'   },
  u7  :{ label:'今週中',     icon:'▲', cls:'u-7',     stripe:'stripe-7'   },
  u14 :{ label:'2週間以内', icon:'○', cls:'u-14',    stripe:'stripe-14'  },
  u30 :{ label:'それ以降',   icon:'○', cls:'u-30',    stripe:'stripe-30'  }
};
const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
const fmtDiff = n => n < 0 ? `${-n}日超過` : n === 0 ? '本日' : `あと${n}日`;

function buildFilters(){
  const fill = (sel, vals, label) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${label}：すべて</option>` +
      vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = vals.includes(cur) ? cur : '';
  };
  fill($('#fOwner'),  [...new Set(ALL.map(i => i.owner))].sort(), '担当者');
  fill($('#fStatus'), [...new Set(ALL.map(i => i.group))].sort(), 'ステータス');
  const m = $('#mOwner');
  m.innerHTML = `<option value="__all">全担当者ぶんをまとめて</option>` +
    [...new Set(ALL.map(i => i.owner))].sort().map(v => `<option value="${esc(v)}">${esc(v)} さん宛</option>`).join('');
}

function filtered(){
  const t = $('#fText').value.trim();
  const o = $('#fOwner').value, s = $('#fStatus').value, u = $('#fUrg').value;
  const inHouseOnly = $('#fInHouse').checked;
  let list = ALL.filter(i =>
    (!t || (i.company + i.sub).includes(t)) &&
    (!o || i.owner === o) && (!s || i.group === s) && (!u || i.urg === u) &&
    (!inHouseOnly || IN_HOUSE_COMPANIES.has(i.company)));
  const sort = $('#fSort').value;
  list.sort((a,b) =>
    sort === 'owner'   ? a.owner.localeCompare(b.owner, 'ja')   || a.date - b.date :
    sort === 'company' ? a.company.localeCompare(b.company,'ja')|| a.date - b.date :
                         a.date - b.date || a.company.localeCompare(b.company, 'ja'));
  return list;
}

function bars(target, pairs){
  const max = Math.max(1, ...pairs.map(p => p[1]));
  target.innerHTML = pairs.map(([k, v]) => `
    <div class="flex items-center gap-3">
      <div class="w-28 shrink-0 text-xs ink-2 text-right truncate" title="${esc(k)}">${esc(k)}</div>
      <div class="flex-1 h-4 bar-track rounded-sm overflow-hidden">
        <div class="h-full bar-fill" style="width:${Math.max(2, v / max * 100)}%"></div>
      </div>
      <div class="w-9 shrink-0 text-xs font-bold tnum text-right">${v}</div>
    </div>`).join('');
}

function render(){
  const list = filtered();

  /* KPI */
  const n = u => ALL.filter(i => i.urg === u).length;
  /* 数値は必ず本文インク（黄色は白背景で判読できないため）。色は左のストライプが担う。 */
  const kpi = [
    { v: ALL.length,          k:'未完了 合計',       tone:'var(--ink-3)',      num:'var(--ink-1)' },
    { v: n('over') + n('u3'), k:'期限超過・3日以内', tone:'var(--c-critical)', num:'var(--c-critical)' },
    { v: n('u7'),             k:'1週間以内',         tone:'var(--c-warning)',  num:'var(--ink-1)' },
    { v: new Set(ALL.map(i => i.owner)).size, k:'関係する担当者', tone:'var(--ink-3)', num:'var(--ink-1)' }
  ];
  $('#kpis').innerHTML = kpi.map(x => `
    <div class="card-surface border rounded-xl p-4 relative overflow-hidden">
      <div class="absolute inset-y-0 left-0 w-1" style="background:${x.tone}"></div>
      <div class="text-3xl font-bold leading-none" style="color:${x.num}">${x.v}<span class="text-sm ink-3 font-normal ml-1">件</span></div>
      <div class="text-xs ink-2 mt-1.5">${x.k}</div>
    </div>`).join('');

  /* チャート */
  const count = (key, pred) => {
    const src = pred ? ALL.filter(pred) : ALL;
    const m = new Map();
    src.forEach(i => m.set(i[key], (m.get(i[key]) || 0) + 1));
    return [...m.entries()].sort((a,b) => b[1] - a[1]);
  };
  bars($('#chartStatus'), count('group'));
  bars($('#chartOwner'),  count('owner', i => i.diff <= 14 && (i.group === '未作成' || i.group === '作成中')).slice(0, 10));

  /* カード（同じ企業は1枠にまとめる。枠内の並び順は一覧の並び順を維持） */
  $('#filterNote').textContent = `${list.length} 件を表示中（全 ${ALL.length} 件）`;
  $('#empty').classList.toggle('hidden', list.length > 0);

  const groups = [];
  const groupIndex = new Map();
  list.forEach(i => {
    if (!groupIndex.has(i.company)) { groupIndex.set(i.company, groups.length); groups.push({ company: i.company, items: [] }); }
    groups[groupIndex.get(i.company)].items.push(i);
  });
  const URG_ORDER = ['over','u3','u7','u14','u30'];
  const worstUrg = items => items.reduce((w, i) => URG_ORDER.indexOf(i.urg) < URG_ORDER.indexOf(w) ? i.urg : w, items[0].urg);

  $('#cards').innerHTML = groups.map(({ company, items }) => {
    const u = URG[worstUrg(items)];
    const first = items[0];
    return `
    <article class="card-surface border rounded-xl p-4 relative overflow-hidden">
      <div class="absolute inset-y-0 left-0 w-1 ${u.stripe}"></div>
      <div class="flex items-center gap-2 mb-2">
        <span class="text-[11px] font-bold px-2 py-0.5 rounded ${u.cls}">${u.icon} ${u.label}</span>
        <span class="text-xs ink-3 ml-auto">${items.length} 件</span>
      </div>
      <h3 class="font-bold text-[15px] leading-snug">${esc(company)}</h3>
      <div class="mt-2.5 space-y-1.5">
        ${items.map(i => `
        <div class="flex items-start gap-2 text-xs">
          <span class="font-bold tnum shrink-0 w-12">${fmtDate(i.date)}</span>
          <span class="ink-3 tnum shrink-0 w-14">${fmtDiff(i.diff)}</span>
          <span class="ink-2 leading-snug flex-1">${esc(i.group)}</span>
        </div>`).join('')}
      </div>
      <dl class="mt-3 pt-3 border-t hair grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
        <div><dt class="ink-3 inline">作成者</dt> <dd class="inline font-medium">${esc(first.author || '未設定')}</dd></div>
        <div><dt class="ink-3 inline">基本編集</dt> <dd class="inline font-medium">${esc(first.editor || '—')}</dd></div>
        <div><dt class="ink-3 inline">運用</dt> <dd class="inline font-medium">${esc(first.ope || '—')}</dd></div>
        <div><dt class="ink-3 inline">D/P</dt> <dd class="inline font-medium">${esc(first.dir || '—')}</dd></div>
      </dl>
    </article>`;
  }).join('');
}

/* =========================================================
   7. リマインド文
   ========================================================= */
function reminderFor(owner){
  const list = ALL.filter(i => i.owner === owner && isReminderTarget(i)).sort((a,b) => a.date - b.date);
  if (!list.length) return '';
  const byCompany = new Map();
  list.forEach(i => {
    if (!byCompany.has(i.company)) byCompany.set(i.company, { company: i.company, items: [] });
    byCompany.get(i.company).items.push(i);
  });
  const body = [...byCompany.values()]
    .map(({ company, items }) => `⭐️${company}（${items.length}件）\n\n${items.map(i => fmtDate(i.date)).join('\n')}`)
    .join('\n\n\n');
  return `【担当：${owner}】\n\n${body}`;
}
function buildReminder(){
  const v = $('#mOwner').value;
  $('#mText').value = v === '__all'
    ? [...new Set(ALL.map(i => i.owner))].sort()
        .map(o => reminderFor(o)).filter(Boolean).join('\n\n' + '─'.repeat(28) + '\n\n')
    : reminderFor(v);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta = el('textarea'); ta.value = t;
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}

/* =========================================================
   8. CSV 書き出し
   ========================================================= */
function exportCSV(){
  const rows = [['投稿日','残り','緊急度','企業名/コンテンツ名','補足','ステータス','作成者','基本編集','運用','D/P']];
  filtered().forEach(i => rows.push([
    fmtDate(i.date), fmtDiff(i.diff), URG[i.urg].label,
    i.company, i.sub, i.statusRaw, i.author, i.editor, i.ope, i.dir
  ]));
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = `未完了動画_${toInput(baseDate())}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* =========================================================
   9. イベント
   ========================================================= */
$('#syncBtn').onclick = syncData;
$('#baseDate').addEventListener('input', runExtract);
['#rangeDays','#incOverdue','#dirDone','#incBlank'].forEach(s => $(s).addEventListener('change', runExtract));
$('#doneList').addEventListener('input', runExtract);
['#fText','#fOwner','#fStatus','#fUrg','#fSort','#fInHouse'].forEach(s => $(s).addEventListener('input', render));
$('#csvBtn').onclick    = exportCSV;
syncData();

$('#remindBtn').onclick = () => { buildReminder(); $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex'); };
$('#mOwner').onchange   = buildReminder;
$('#mClose').onclick    = () => { $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); $('#mMsg').textContent=''; };
$('#modal').onclick     = e => { if (e.target === $('#modal')) $('#mClose').click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) $('#mClose').click(); });
/* Tailwind CDN が読めない環境（社内ネットワーク等）での注意表示 */
if (!window.tailwind){
  const bar = el('div', '', 'スタイル（Tailwind CDN）を読み込めませんでした。インターネットに接続できる環境で開くと、正しいデザインで表示されます。機能そのものは動作します。');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px;font-size:12px;background:#d03b3b;color:#fff';
  document.body.appendChild(bar);
}

$('#mCopy').onclick = async () => {
  const ok = await copyText($('#mText').value);
  $('#mMsg').textContent = ok ? '✓ コピーしました' : '手動でコピーしてください';
  $('#mMsg').style.color = ok ? 'var(--c-good)' : 'var(--c-critical)';
  setTimeout(() => $('#mMsg').textContent = '', 2600);
};
</script>
